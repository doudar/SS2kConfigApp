name: ss2kconfigapp
description: Configures the SmartSpin2k using BLE
version: 1.1.1+44
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: 1.36.8  # Pin to avoid Android configuration issues
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.3.9
  shared_preferences: ^2.2.0
  wakelock_plus: ^1.3.3
  http: ^1.2.0
  font_awesome_flutter: ^10.9.0  # Pin to avoid compatibility issues with newer versions
  flutter_archive: ^6.0.3
  provider: ^6.1.1
  path_provider: ^2.1.5
  xml: ^6.5.0
  file_picker:
    git:
      url: https://github.com/cypherstack/flutter_file_picker.git
      ref: master
  audioplayers: ^6.1.0  # Pin to avoid Android SDK compatibility issues
  just_audio: ^0.9.36
  share_plus: ^12.0.1
  fit_tool: ^1.0.5
  gpx: ^2.2.1
  flutter_tts: ^4.2.0
  url_launcher: ^6.2.5
  app_links: ^6.3.2     # Pin to pre-6.4 to avoid new Gradle plugin API requirement
  reorderables: ^0.6.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.24.9

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/appainter_theme.json
    - assets/appainter_theme_dark.json
    - assets/sounds/

dependency_overrides:
  app_links: 6.3.2
  #package_info_plus: 8.3.1
