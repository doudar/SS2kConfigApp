buildscript {
    ext.kotlin_version = '1.9.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Force all Android library subprojects (plugins) to use compileSdkVersion 36 to satisfy
// newer androidx dependencies requiring >=34.
subprojects { subProj ->
    afterEvaluate { proj ->
        if (proj.hasProperty('android') && proj.android.hasProperty('compileSdkVersion')) {
            try {
                proj.android.compileSdkVersion = 36
            } catch (ignored) {}
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
